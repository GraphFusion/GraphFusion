name: Python bindings

on:
  pull_request:
    paths: ['python/**', 'crates/**', 'Cargo.*', 'pyproject.toml', 'rust-toolchain.toml', '.github/workflows/python.yml']
  push:
    branches: [main]
    paths: ['python/**', 'crates/**', 'Cargo.*', 'pyproject.toml', 'rust-toolchain.toml', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build portable wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --locked --out dist
          manylinux: auto
          rust-toolchain: '1.98.0'
      - name: Test installed wheel
        run: |
          python -m pip install pytest pandas twine dist/*.whl
          python -m twine check dist/*.whl
          python -m pytest python/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.10'
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and validate source distribution
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          python -m pip install 'maturin>=1.9,<2' twine pytest pandas
          maturin sdist --out dist
          python -m twine check dist/*
          python -m pip install dist/*.tar.gz
          python -m pytest python/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
