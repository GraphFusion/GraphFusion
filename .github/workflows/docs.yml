name: Documentation

on:
  push:
    branches: [main]
    paths: ['website/**', 'README.md', 'docs/**', 'crates/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'README.md', 'docs/**', 'crates/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Install browser engine toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y clang binaryen
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: docs-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install version-matched browser bindings
        run: |
          if ! wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128'; then
            cargo install wasm-bindgen-cli --version 0.2.128 --locked
          fi
      - run: npm run build:wasm
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/legacy-dist

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: docs-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: python3 website/scripts/check-examples.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://graphfusion.github.io/
    steps:
      - name: Deploy legacy redirects
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
