[workspace]
members = [
    "crates/graphfusion",
    "crates/gql-parser",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/GraphFusion/GraphFusion"
homepage = "https://graphfusion.github.io/"

[workspace.lints.rust]
unsafe_code = "forbid"
