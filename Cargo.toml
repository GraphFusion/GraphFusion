[workspace]
members = [
    "crates/graphfusion",
    "crates/gql-parser",
    "crates/graphfusion-wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.0-dev"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/GraphFusion/GraphFusion"
homepage = "https://graphfusion.github.io/"

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimize the browser bundle without expensive workspace-wide LTO.
[profile.wasm]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1
