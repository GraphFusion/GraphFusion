[package]
name = "graphfusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GraphFusion graph database."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/graphfusion"
readme = "README.md"
keywords = ["graph", "database", "gql", "datafusion", "arrow"]
categories = ["database"]

[features]
visualization = []

[dependencies]
async-trait = "0.1"
base64 = "0.23"
gql-parser = { version = "0.2.0-dev", path = "../gql-parser" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
datafusion = { version = "55.1.0", default-features = false, features = ["math_expressions", "string_expressions", "unicode_expressions", "recursive_protection", "parquet", "serde", "nested_expressions"] }

tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustyline = { version = "18", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["wasmbind"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }

[lints]
workspace = true
